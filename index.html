<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WockingTocking · Trip</title>
<meta name="theme-color" content="#2b2722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WockingTocking">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3e9d6; --card:#fbf5e6; --ink:#2b2722; --soft:#6a6052;
    --rust:#b8472a; --ochre:#9c6b1e; --forest:#2f5d43;
    --line:rgba(43,39,34,.22);
    color-scheme:light;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#e7dabd}
  body{
    font-family:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
    color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .app{max-width:600px;margin:0 auto;background:var(--paper);min-height:100vh;
       box-shadow:0 0 50px -16px rgba(43,39,34,.5);position:relative}

  /* header */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--ink);color:var(--paper);
    padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
    display:flex;align-items:baseline;justify-content:flex-start;gap:10px;
    border-bottom:3px solid var(--rust);
  }
  header .wm{font-family:'Fraunces',serif;font-weight:900;font-size:17px;letter-spacing:-.01em;flex:none}
  header .ep{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.18em;
             text-transform:uppercase;color:#c8a86f;flex:none}

  main{padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
  .tab{display:none}
  .tab.active{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* tab bar */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    max-width:600px;margin:0 auto;
    background:var(--ink);display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    border-top:1px solid #443d34;
  }
  nav.tabs button{
    flex:1;background:none;border:none;cursor:pointer;
    padding:9px 4px 8px;color:#9a8e76;
    font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    border-top:3px solid transparent;
  }
  nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9}
  nav.tabs button.on{color:var(--paper);border-top-color:var(--rust)}

  /* generic */
  h2.sec{font-family:'Fraunces',serif;font-weight:900;font-size:25px;line-height:1.05;
         margin-bottom:4px;letter-spacing:-.01em}
  .lede{font-size:13.5px;color:var(--soft);margin-bottom:16px}
  .day{--c:var(--rust)} .day.d2{--c:var(--ochre)} .day.d3{--c:var(--forest)}
  .dh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
      border-bottom:2.5px solid var(--c);padding:16px 1px 7px;margin-bottom:11px}
  .dh .dn{font-family:'Fraunces',serif;font-weight:900;font-size:18px;color:var(--c)}
  .dh .dd{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;
          text-transform:uppercase;color:var(--soft)}
  .dh .dr{font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;width:100%;margin-top:1px}

  .card{background:var(--card);border:1.5px solid var(--ink);padding:13px 14px;margin-bottom:11px}
  .card.ac{box-shadow:3px 3px 0 var(--c)}
  .cap{font-family:'Fraunces',serif;font-weight:900;font-size:19px;line-height:1.1}
  .sub{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.09em;
       text-transform:uppercase;color:var(--soft);margin-top:3px}

  .mlabel{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;
          letter-spacing:.15em;text-transform:uppercase;color:var(--c,var(--rust));
          border-bottom:1px solid var(--c,var(--rust));padding-bottom:3px;margin:11px 0 6px}
  ul{list-style:none}
  li{font-size:13px;padding:2.5px 0 2.5px 14px;position:relative}
  li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;
             background:var(--c,var(--rust));transform:rotate(45deg)}
  li.f::before{transform:none;width:0;height:0;background:none;top:7px;
               border-left:6px solid var(--c,var(--rust));
               border-top:4px solid transparent;border-bottom:4px solid transparent}

  .chip{display:inline-block;font-family:'Space Mono',monospace;font-size:10.5px;
        font-weight:700;padding:4px 8px;margin:0 5px 5px 0}
  .chip.t{background:rgba(43,39,34,.07);border:1px solid var(--line)}
  .chip.lv{background:var(--rust);color:var(--card)}

  /* buttons */
  .btnrow{display:flex;gap:7px;margin-top:9px}
  a.btn{flex:1;text-decoration:none;text-align:center;padding:11px 6px;
        font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;
        letter-spacing:.03em;border:1.5px solid var(--ink)}
  a.btn.g{background:var(--c,var(--rust));color:var(--card)}
  a.btn.w{background:var(--card);color:var(--ink)}
  a.full{display:block;text-decoration:none;text-align:center;background:var(--ink);
         color:var(--paper);border:2px solid var(--c);padding:12px;margin-bottom:13px;
         font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:.06em}
  a.full span{color:var(--c)}
  a.full small{display:block;font-family:'Hanken Grotesk',sans-serif;font-weight:400;
               letter-spacing:0;font-size:10.5px;color:#c8b89a;margin-top:3px}

  /* walk loop */
  .walk{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px}
  .wpt{display:flex;align-items:center;gap:8px;padding:5px 0;
       border-bottom:1px solid rgba(43,39,34,.09)}
  .wd{flex:none;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--c);
      color:var(--c);font-family:'Space Mono',monospace;font-size:9px;font-weight:700;
      display:flex;align-items:center;justify-content:center}
  .wn{flex:1;font-size:12.5px;font-weight:500}
  a.pin{flex:none;text-decoration:none;font-family:'Space Mono',monospace;font-size:9.5px;
        font-weight:700;color:var(--c);border:1px solid var(--c);padding:3px 7px}
  a.walkbtn{display:block;text-decoration:none;text-align:center;margin-top:9px;padding:10px;
            border:1.5px solid var(--c);background:var(--c);color:var(--card);
            font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.05em}

  /* hero */
  .hero{background:var(--ink);color:var(--paper);padding:22px 18px;margin-bottom:15px}
  .hero .k{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.22em;
           text-transform:uppercase;color:#c8a86f}
  .hero h1{font-family:'Fraunces',serif;font-weight:900;font-size:36px;line-height:.98;
           margin-top:8px}
  .hero h1 em{font-style:italic;font-weight:600;color:#e8b873}
  .hero .meta{margin-top:11px;font-family:'Space Mono',monospace;font-size:11px;
              letter-spacing:.04em;color:#ddd0b4}
  .stripe{height:6px;display:flex;margin-bottom:15px}
  .stripe i{flex:1}
  .glance{display:flex;align-items:flex-start;gap:10px;padding:9px 0;
          border-bottom:1px solid var(--line)}
  .gd{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-family:'Fraunces',serif;font-weight:900;font-size:14px;
      color:var(--card)}
  .gt{font-family:'Fraunces',serif;font-weight:900;font-size:15px}
  .gs{font-size:12px;color:var(--soft)}
  .note{font-size:12.5px;color:var(--soft);font-style:italic;margin-top:6px}
  .p0{font-size:13.5px;margin-bottom:9px}
  .tipbox{background:var(--card);border-left:3px solid var(--rust);padding:10px 12px;
          margin-bottom:11px;font-size:13px}
  .tipbox b{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;
            text-transform:uppercase;color:var(--rust);display:block;margin-bottom:3px}
  .ck{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13px;
      border-bottom:1px solid var(--line)}
  .ck b{flex:none;width:15px;height:15px;border:1.5px solid var(--rust);margin-top:2px}
</style>
</head>
<body>
<div class="app">

  <header>
    <span class="wm">WockingTocking</span>
    <span class="ep">Episode 01</span>
  </header>

  <main>
    <section class="tab active" id="trip"></section>
    <section class="tab" id="route"></section>
    <section class="tab" id="plan"></section>
    <section class="tab" id="talk"></section>
  </main>

  <nav class="tabs">
    <button data-tab="trip" class="on">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V5l9-3 9 3v16"/><path d="M3 21h18"/><path d="M9 21v-6h6v6"/></svg>Trip
    </button>
    <button data-tab="route">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Route
    </button>
    <button data-tab="plan">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Plan
    </button>
    <button data-tab="talk">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/></svg>Talk
    </button>
  </nav>

</div>

<script>
(function () {
  var TRIPS = null;
  var TRIP  = null;
  var ACTIVE = null;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function attr(s) { return esc(s); }
  function colorVar(c) { return 'var(--' + (c || 'rust') + ')'; }
  function stop(id) { return TRIP && TRIP.stops && TRIP.stops[id]; }

  /* ---------- tabs ---------- */
  function showTab(name) {
    var secs = document.querySelectorAll('.tab');
    var btns = document.querySelectorAll('nav.tabs button');
    secs.forEach(function (s) { s.classList.toggle('active', s.id === name); });
    btns.forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
    window.scrollTo(0, 0);
    try { localStorage.setItem('wt_tab', name); } catch (e) {}
  }

  /* ---------- bootstrap ---------- */
  function loadTrip(id) {
    return fetch('trips/' + id + '.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('trip ' + id + ' failed'); return r.json(); })
      .then(function (t) { TRIP = t; ACTIVE = id; });
  }

  function renderAll() {
    renderTrip();
    renderRoute();
    renderPlan();
    renderTalk();
  }

  function wireTabs() {
    document.querySelectorAll('nav.tabs button').forEach(function (b) {
      b.addEventListener('click', function () { showTab(b.dataset.tab); });
    });
  }

  function boot() {
    fetch('trips/index.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('index failed'); return r.json(); })
      .then(function (idx) {
        TRIPS = idx;
        var stored = null;
        try { stored = localStorage.getItem('wt_trip'); } catch (e) {}
        var valid = stored && idx.trips.some(function (t) { return t.id === stored; });
        var id = valid ? stored : idx.default;
        return loadTrip(id);
      })
      .then(function () {
        renderAll();
        wireTabs();
        try {
          var last = localStorage.getItem('wt_tab');
          if (last && document.getElementById(last)) showTab(last);
        } catch (e) {}
      })
      .catch(function (err) {
        var msg = '<div style="padding:20px;border:1.5px solid #b8472a;background:#fbf5e6;margin:14px 0">'
          + '<b style="font-family:\'Space Mono\',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#b8472a;display:block;margin-bottom:6px">Trips failed to load</b>'
          + 'Refresh the page when you have a connection. (' + esc(err.message) + ')'
          + '</div>';
        document.querySelector('main').innerHTML = msg;
      });
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  /* ============================================================
     Renderers
     ============================================================ */

  function renderTrip() {
    var t = TRIP;
    var glance = t.dayGlance.map(function (g) {
      return ''
        + '<div class="glance">'
        + '<div class="gd" style="background:' + colorVar(g.color) + '">' + esc(g.n) + '</div>'
        + '<div><div class="gt">' + esc(g.title) + '</div>'
        + '<div class="gs">' + esc(g.sub) + '</div></div>'
        + '</div>';
    }).join('');

    var acts = t.acts.map(function (a) {
      return ''
        + '<div class="card act-card" data-act="' + attr(a.id) + '">'
        + '<div class="cap" style="font-size:15px;color:' + colorVar(a.color) + '">' + esc(a.label) + '</div>'
        + '<p style="font-size:13px;margin-top:4px">' + esc(a.tagline) + '</p>'
        + '</div>';
    }).join('');

    var kit = t.kit.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('');
    var pre = t.preTrip.map(function (p, i) {
      return '<div class="ck" data-ck="' + i + '"><b></b><span>' + esc(p) + '</span></div>';
    }).join('');

    /* Hero title heuristic: split on " to " preserve italic em for the connector */
    var heroTitle;
    var parts = t.title.split(' to ');
    if (parts.length === 2) {
      heroTitle = esc(parts[0]) + ' <em>to</em> ' + esc(parts[1]);
    } else {
      heroTitle = esc(t.title);
    }

    var html = ''
      + '<div class="hero">'
      +   '<div class="k">' + esc(t.heroKicker) + '</div>'
      +   '<h1>' + heroTitle + '</h1>'
      +   '<div class="meta">' + esc(t.subtitle) + '<br>' + esc(t.dates) + '</div>'
      + '</div>'
      + '<div class="stripe">'
      +   '<i style="background:var(--rust)"></i><i style="background:var(--ochre)"></i><i style="background:var(--forest)"></i>'
      + '</div>'
      + '<p class="p0">' + esc(t.intro) + '</p>'
      + '<h2 class="sec">The three days</h2>'
      + '<div class="lede">Tap <b>Route</b> for navigation, <b>Plan</b> for the timed agenda, <b>Talk</b> for what to say on camera.</div>'
      + glance
      + '<h2 class="sec" style="margin-top:22px">The story to film</h2>'
      + '<div class="lede">Three acts — let the episode build.</div>'
      + acts
      + '<h2 class="sec" style="margin-top:22px">Your kit</h2>'
      + '<ul style="margin-top:8px">' + kit + '</ul>'
      + '<h2 class="sec" style="margin-top:22px">Before you go</h2>'
      + '<div style="margin-top:8px">' + pre + '</div>'
      + '<div class="tipbox" style="margin-top:14px"><b>Golden rule</b>' + esc(t.goldenRule) + '</div>';
    document.getElementById('trip').innerHTML = html;
  }

  function routeCardHTML(stopObj) {
    if (!stopObj || !stopObj.routeCard) return '';
    var rc = stopObj.routeCard;
    var walkPts = (rc.walkPoints || []).map(function (w) {
      return '<div class="wpt"><span class="wd">' + esc(w.n) + '</span>'
           + '<span class="wn">' + esc(w.name) + '</span>'
           + '<a class="pin" href="' + attr(w.pinHref) + '">Map</a></div>';
    }).join('');
    var walkLoop = rc.walkLoopHref
      ? '<a class="walkbtn" href="' + attr(rc.walkLoopHref) + '">▶ WALK THIS LOOP</a>'
      : '';
    var leadNote   = rc.walkLeadNote ? '<div class="note" style="margin-top:0">' + esc(rc.walkLeadNote) + '</div>' : '';
    var trailNote  = rc.trailingNote ? '<div class="note">' + esc(rc.trailingNote) + '</div>' : '';
    var topNote    = rc.note ? '<div class="note">' + esc(rc.note) + '</div>' : '';
    var walkBlock  = (rc.walkPoints && rc.walkPoints.length)
      ? '<div class="walk">' + leadNote + walkPts + walkLoop + trailNote + '</div>'
      : '';

    return ''
      + '<div class="card ac">'
      +   '<div class="cap">' + esc(stopObj.name) + '</div>'
      +   '<div class="sub">' + esc(rc.sub || '') + '</div>'
      +   topNote
      +   '<div class="btnrow">'
      +     '<a class="btn g" href="' + attr(rc.mapsHref) + '">Google Maps</a>'
      +     '<a class="btn w" href="' + attr(rc.wazeHref) + '">Waze</a>'
      +   '</div>'
      +   walkBlock
      + '</div>';
  }

  function renderRoute() {
    var t = TRIP;
    var days = t.days.map(function (d) {
      var cards = d.routeStops.map(function (sid) { return routeCardHTML(stop(sid)); }).join('');
      return ''
        + '<div class="day d' + esc(d.id.slice(1)) + '" style="--c:' + colorVar(d.color) + '">'
        +   '<div class="dh"><span class="dn">' + esc(d.label) + '</span>'
        +     '<span class="dd">' + esc(d.date) + '</span>'
        +     '<span class="dr">' + esc(d.routeHeader) + '</span></div>'
        +   '<a class="full" href="' + attr(d.fullRoute.href) + '">'
        +     '<span>▶</span> ' + esc(d.fullRoute.label)
        +     '<small>' + esc(d.fullRoute.sub) + '</small></a>'
        +   cards
        + '</div>';
    }).join('');

    var html = ''
      + '<h2 class="sec">Route &amp; Navigation</h2>'
      + '<p class="lede">Driving links connect the towns; walking loops connect the sights inside each one. Set destinations while parked — never while moving.</p>'
      + days;
    document.getElementById('route').innerHTML = html;
  }

  function planCardHTML(stopObj) {
    if (!stopObj || !stopObj.planCard) return '';
    var p = stopObj.planCard;
    var leaveChip = p.leaveBy ? '<span class="chip lv">LEAVE BY ' + esc(p.leaveBy) + '</span>' : '';
    var see  = p.see.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('');
    var film = p.film.map(function (f) { return '<li class="f">' + esc(f) + '</li>'; }).join('');
    return ''
      + '<div class="card">'
      +   '<div class="cap" style="font-size:16px">' + esc(stopObj.name) + '</div>'
      +   '<span class="chip t">' + esc(p.time) + '</span>' + leaveChip
      +   '<div class="mlabel">See</div><ul>' + see + '</ul>'
      +   '<div class="mlabel">Film</div><ul>' + film + '</ul>'
      + '</div>';
  }

  function renderPlan() {
    var t = TRIP;
    var days = t.days.map(function (d) {
      var note = d.planNote
        ? '<div class="tipbox" style="border-color:' + colorVar(d.planNote.color) + '">'
        +   '<b style="color:' + colorVar(d.planNote.color) + '">' + esc(d.planNote.kicker) + '</b>' + esc(d.planNote.text)
        + '</div>'
        : '';
      var cards = d.planStops.map(function (sid) { return planCardHTML(stop(sid)); }).join('');
      var arr = d.planArrival
        ? '<div class="card ac"><div class="cap" style="font-size:15px">' + esc(d.planArrival.title) + '</div>'
        +   '<p style="font-size:12.5px;margin-top:3px">' + esc(d.planArrival.note) + '</p></div>'
        : '';
      return ''
        + '<div class="day d' + esc(d.id.slice(1)) + '" style="--c:' + colorVar(d.color) + '">'
        +   '<div class="dh"><span class="dn">' + esc(d.label) + '</span>'
        +     '<span class="dd">' + esc(d.date) + '</span>'
        +     '<span class="dr">' + esc(d.planHeader) + '</span></div>'
        +   note + cards + arr
        + '</div>';
    }).join('');

    var html = ''
      + '<h2 class="sec">The Plan</h2>'
      + '<p class="lede">The timed agenda for each day — when to be where, and what to film.</p>'
      + days;
    document.getElementById('plan').innerHTML = html;
  }

  function talkCardHTML(stopObj) {
    if (!stopObj || stopObj.hideOnTalk) return '';
    var act = (TRIP.acts || []).filter(function (a) { return a.id === stopObj.actId; })[0];
    var color = colorVar(act ? act.color : 'rust');
    var facts = (stopObj.facts || []).map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('');
    return ''
      + '<div class="card">'
      +   '<div class="cap" style="font-size:16px;color:' + color + '">' + esc(stopObj.name) + '</div>'
      +   '<div class="sub">Angle: ' + esc(stopObj.angle) + '</div>'
      +   (facts ? '<ul style="margin-top:7px">' + facts + '</ul>' : '')
      + '</div>';
  }

  function bookendCardHTML(b) {
    var facts = (b.facts || []).map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('');
    return ''
      + '<div class="card">'
      +   '<div class="cap" style="font-size:16px;color:' + colorVar(b.color) + '">' + esc(b.title) + '</div>'
      +   '<div class="sub">' + esc(b.where) + '</div>'
      +   '<ul style="margin-top:7px">' + facts + '</ul>'
      + '</div>';
  }

  function renderTalk() {
    var t = TRIP;
    var stops = (t.acts || []).map(function (a) {
      return (a.stopIds || []).map(function (sid) { return talkCardHTML(stop(sid)); }).join('');
    }).join('');

    var rules = (t.goldenRules || []).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('');

    var html = ''
      + '<h2 class="sec">What to Talk About</h2>'
      + '<p class="lede">Learn two or three points per stop, then say them in your own words — don\'t read a script.</p>'
      + '<div class="tipbox"><b>On camera</b>' + esc(t.talkTipbox) + '</div>'
      + bookendCardHTML(t.coldOpen)
      + stops
      + bookendCardHTML(t.signOff)
      + '<h2 class="sec" style="margin-top:20px">Golden rules</h2>'
      + '<ul style="margin-top:8px">' + rules + '</ul>'
      + (t.outro ? '<p class="note" style="margin:14px 0 4px">' + esc(t.outro) + '</p>' : '');
    document.getElementById('talk').innerHTML = html;
  }

  /* ---------- go ---------- */
  boot();
})();
</script>
</body>
</html>
